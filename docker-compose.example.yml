services:
  nest-protect-auth-bridge:
    build:
      context: ./addons/nest-protect-auth-bridge
      dockerfile: Dockerfile.standalone
    image: nest-protect-auth-bridge:local
    container_name: nest-protect-auth-bridge
    environment:
      AUTH_BRIDGE_MODE: standalone
      HA_BASE_URL: ${HA_BASE_URL:-http://192.168.178.xxx:8123}
      AUTH_BRIDGE_PORT: ${AUTH_BRIDGE_PORT:-8099}
    ports:
      - "${AUTH_BRIDGE_PORT:-8099}:${AUTH_BRIDGE_PORT:-8099}"
    restart: unless-stopped
