<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nest Protect Auth Bridge</title>
    <style>
      :root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
      body { margin: 0; padding: clamp(0.75rem, 3vw, 2rem); }
      main { max-width: 72rem; margin: auto; }
      h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }
      p { margin: 0.5rem 0 1rem; }
      .controls { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-block: 1rem; }
      button { font: inherit; min-height: 44px; padding: 0.5rem 0.9rem; border-radius: 0.6rem; }
      .primary { background: #075b8a; color: #fff; border: 1px solid transparent; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .status { padding: 0.7rem 0.9rem; border: 1px solid GrayText; border-radius: 0.7rem; }
      .status p { margin-block: 0.25rem; }
      iframe { display: block; box-sizing: border-box; width: 100%; height: 62vh; height: 62dvh;
        min-height: 19rem; border: 1px solid GrayText; border-radius: 0.7rem; margin-top: 1rem; }
      iframe:fullscreen { width: 100%; height: 100%; border: 0; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-text="title">Connect Nest Protect</h1>
      <p data-text="intro">Sign in with your Google account in the browser below, then return to Home Assistant.</p>

      <div class="controls">
        <form action="start" method="post" id="start-form">
          <button class="primary" id="start-button" type="submit" data-text="start">Start Login</button>
        </form>
        <form action="reset" method="post">
          <button id="reset-button" type="submit" data-text="reset">Start over</button>
        </form>
        <button id="fullscreen-button" type="button" data-text="fullscreen" hidden>Full screen</button>
      </div>

      <section class="status" aria-live="polite">
        <strong id="status"></strong>
        <p id="message"></p>
      </section>

      <p id="verification" hidden>
        <span data-text="verification"></span>
        <a href="https://g.co/sc" target="_blank" rel="noopener noreferrer">g.co/sc</a>
      </p>
      <iframe id="vnc-frame" title="Nest login browser" allow="clipboard-read; clipboard-write" hidden></iframe>
    </main>

    <script>
      const copy = navigator.language.toLowerCase().startsWith('de') ? {
        title: 'Nest Protect verbinden',
        intro: 'Melde dich unten im Browser mit deinem Google-Konto an und kehre danach zu Home Assistant zurück.',
        start: 'Anmeldung starten', reset: 'Von vorn anfangen', fullscreen: 'Vollbild', browser: 'Browser für die Nest-Anmeldung',
        resetting: 'Der Browser wird geschlossen. Öffne danach einen neuen Anmeldelink in Home Assistant.',
        verification: 'Wenn Google diesen Link anzeigt, öffne ihn direkt auf dem Handy und kehre nach der Bestätigung hierher zurück:',
        starting: 'Browser wird gestartet', waiting: 'Melde dich bei Google an.',
        posting: 'Home Assistant übernimmt die Anmeldung.',
        done: 'Anmeldung abgeschlossen. Wechsle zurück zu Home Assistant.',
        missing: 'Öffne den Anmeldelink über die Nest-Protect-Einrichtung in Home Assistant.',
        retry: 'Starte die Anmeldung über Home Assistant erneut.',
        offline: 'Verbindung zur Auth Bridge unterbrochen. Es wird erneut versucht.',
      } : {
        title: 'Connect Nest Protect',
        intro: 'Sign in with your Google account in the browser below, then return to Home Assistant.',
        start: 'Start Login', reset: 'Start over', fullscreen: 'Full screen', browser: 'Nest login browser',
        resetting: 'Closing the browser. Then open a new sign-in link in Home Assistant.',
        verification: 'If Google shows this address, open it directly on your phone. Return here after verifying:',
        starting: 'Starting the browser', waiting: 'Sign in to your Google account.',
        posting: 'Finishing sign-in in Home Assistant.',
        done: 'Signed in. Return to Home Assistant.',
        missing: 'Open the sign-in link from the Nest Protect setup in Home Assistant.',
        retry: 'Start sign-in again from Home Assistant.',
        offline: 'Connection to the Auth Bridge was interrupted. Retrying.',
      };
      document.documentElement.lang = navigator.language.toLowerCase().startsWith('de') ? 'de' : 'en';
      document.querySelectorAll('[data-text]').forEach((node) => {
        node.textContent = copy[node.dataset.text];
      });
      const frame = document.getElementById('vnc-frame');
      frame.title = copy.browser;
      const basePath = window.location.pathname.replace(/[^/]*$/, '');
      const websockifyPath = basePath.replace(/^\//, '') + 'websockify';

      const params = new URLSearchParams(window.location.search);
      const hasLaunchValues = ['session_id', 'secret'].every((key) => {
        const value = params.get(key);
        return value && value.trim().length > 0;
      });

      if (hasLaunchValues) {
        const form = document.getElementById('start-form');
        ['session_id', 'secret', 'callback_url'].forEach((key) => {
          if (!params.has(key)) {
            return;
          }
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = params.get(key);
          form.appendChild(input);
        });

      }

      const fullscreen = document.getElementById('fullscreen-button');
      fullscreen.addEventListener('click', () => {
        if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {});
      });

      function renderStatus(data) {
        const busy = data.running || data.status === 'browser_starting';
        document.getElementById('start-button').disabled = !hasLaunchValues || busy;
        document.getElementById('reset-button').disabled = Boolean(data.resetting);
        fullscreen.hidden = !busy || !frame.requestFullscreen;
        document.getElementById('verification').hidden = !busy;
        frame.hidden = !busy;
        if (busy && !frame.getAttribute('src')) {
          frame.src = 'novnc/vnc.html?autoconnect=true&resize=scale&view_only=false&show_dot=false&path=' +
            encodeURIComponent(websockifyPath);
        }
        let status = copy.waiting;
        let hint = '';
        if (data.resetting) {
          status = copy.resetting;
        } else if (data.status === 'done') {
          status = copy.done;
        } else if (data.status === 'failed' || data.status === 'timeout') {
          status = data.message || copy.retry;
          hint = copy.retry;
        } else if (data.status === 'browser_starting') {
          status = copy.starting;
        } else if (data.status === 'posting_to_home_assistant') {
          status = copy.posting;
        } else if (!hasLaunchValues && !busy) {
          status = copy.missing;
        }
        document.getElementById('status').textContent = status;
        document.getElementById('message').textContent = hint;
      }

      async function pollStatus() {
        try {
          const response = await fetch('status', {cache: 'no-store'});
          if (!response.ok) throw new Error('Status unavailable');
          renderStatus(await response.json());
        } catch {
          document.getElementById('status').textContent = copy.offline;
        } finally {
          setTimeout(pollStatus, 1000);
        }
      }

      pollStatus();
    </script>
  </body>
</html>
