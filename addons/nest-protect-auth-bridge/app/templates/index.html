<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nest Protect Auth Bridge</title>
    <style>
      body { font-family: sans-serif; margin: 1rem; }
      code { background: #f3f3f3; padding: 0.1rem 0.3rem; }
      .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      button { padding: 0.5rem 0.8rem; }
      iframe { width: 100%; height: 68vh; border: 1px solid #ccc; margin-top: 1rem; }
      .status { margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <h1>Nest Protect Auth Bridge</h1>
    <p>
      Start login to open a visible browser session. Sign in using the embedded browser and
      this add-on will automatically post credentials back to Home Assistant.
    </p>

    <div class="controls">
      <form action="start" method="post" id="start-form">
        <button type="submit">Start Login</button>
      </form>
      <form action="cancel" method="post">
        <button type="submit">Cancel</button>
      </form>
      <form action="reset" method="post">
        <button type="submit">Reset</button>
      </form>
    </div>

    <div class="status">
      <p><strong>Status:</strong> <code id="status">waiting_for_login</code></p>
      <p><strong>Message:</strong> <span id="message"></span></p>
      <p><strong>Session:</strong> <code id="session"></code></p>
      <p><strong>Error:</strong> <code id="error"></code></p>
    </div>

    <iframe
      id="vnc-frame"
      title="Nest login browser"
      allow="clipboard-read; clipboard-write"
    ></iframe>

    <script>
      // Build relative paths based on current location so the UI works behind ingress.
      const basePath = window.location.pathname.replace(/[^/]*$/, '');
      const websockifyPath = basePath.replace(/^\//, '') + 'websockify';
      document.getElementById('vnc-frame').src =
        'novnc/vnc.html?autoconnect=true&resize=scale&view_only=false&show_dot=true&path=' + websockifyPath;

      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id') || '';
      const hasLaunchValues = ['session_id', 'secret', 'callback_url'].every((key) => {
        const value = params.get(key);
        return value && value.trim().length > 0;
      });

      if (hasLaunchValues) {
        const form = document.getElementById('start-form');
        ['session_id', 'secret', 'callback_url'].forEach((key) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = params.get(key);
          form.appendChild(input);
        });

        const autoStartKey = 'nest_auth_bridge_auto_started_' + sessionId;
        if (!sessionStorage.getItem(autoStartKey)) {
          sessionStorage.setItem(autoStartKey, '1');
          form.submit();
        }
      }

      async function pollStatus() {
        const response = await fetch('status');
        const data = await response.json();
        document.getElementById('status').textContent = data.status;
        document.getElementById('message').textContent = data.message || '';
        document.getElementById('session').textContent = data.session_id || '';
        document.getElementById('error').textContent = data.error || '';
      }

      pollStatus();
      setInterval(pollStatus, 1000);
    </script>
  </body>
</html>
